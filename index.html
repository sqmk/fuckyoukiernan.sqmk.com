<script>
(function () {
  var q = new URLSearchParams(location.search);
  function clean(v) { return (v || '').replace(/[+_]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60); }
  var name = clean(decodeURIComponent(q.get('name') || q.get('to') || q.get('from') || ''))
    || clean(decodeURIComponent((location.hash || '').replace(/^#/, '')));
  if (name) document.getElementById('sig').textContent = name;

  function place(el, min, max) {
    el.style.left = (Math.random() * 100).toFixed(2) + '%';
    el.style.top = (Math.random() * 100).toFixed(2) + '%';
    var s = min + Math.random() * (max - min);
    el.style.width = s.toFixed(1) + 'px';
    el.style.height = s.toFixed(1) + 'px';
    el.style.animationDuration = (3 + Math.random() * 3.5).toFixed(2) + 's';
  }
  document.querySelectorAll('.sparkfield').forEach(function (field) {
    var min = +field.dataset.min, max = +field.dataset.max;
    for (var i = 0; i < +field.dataset.count; i++) {
      var el = document.createElement('span');
      el.className = 'spark';
      el.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      place(el, min, max);
      el.addEventListener('animationiteration', function (e) { place(e.currentTarget, min, max); });
      field.appendChild(el);
    }
  });

  var vid = document.getElementById('vid'), wrap = document.getElementById('playwrap');
  function hide() { if (wrap) wrap.remove(); }
  document.getElementById('playbtn').addEventListener('click', function () { vid.play(); hide(); });
  vid.addEventListener('play', hide);
})();
</script>
